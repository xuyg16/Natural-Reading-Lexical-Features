[project]
name = "natural-reading-lexical-features"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yanhong Xu", email = "yanhong16xu@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=3.0",
    "torch>=2.14.0",
    "transformers>=5.16.1",
    "wordfreq>=3.1.1",
]

[project.scripts]
natural-reading-lexical-features = "natural_reading_lexical_features:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.uv]
package = false
